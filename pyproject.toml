[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "course-compass"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.29.0",
    "numpy>=1.26",
    "ollama>=0.4",
    "psycopg[binary]>=3.1",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
course_compass = ["schema.sql", "recommender/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
