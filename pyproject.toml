[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "course-compass"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.115",
    "psycopg[binary]>=3.1",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Reading transcripts and CVs (POST /api/profile/documents) also needs Ollama.
documents = ["ollama>=0.4", "pdfplumber>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
course_compass = ["schema.sql"]
